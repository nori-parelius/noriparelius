{{ define "main" }}
<article class="section-poetry">
  <h1>{{ .Title }}</h1>
  {{ .Content }}
  {{- $pages := where site.RegularPages "Type" .Section -}}
  {{- range (.Paginate $pages 25).Pages -}}
  <div class="h-entry individual-poem">
    <h2 class="p-name">
      <a class="u-url" href="{{ .RelPermalink }}">{{ .Title }}
      </a>
    </h2>
  </div>
  {{- end -}}
  {{- partial "pagination.html" (dict "page" . "format" "default") -}}
</article>
{{- end -}}
