<a class="microblog-latest-link" href="{{ "/microblog" | relURL }}">
  <div class="microblog-latest">
    <h4>Latest from the <span style="text-decoration: underline;">microblog</span></h4>
    {{- range first 1 (where .Site.RegularPages.ByDate.Reverse "Type" "microblog") -}}
    <div class="latest-snippet">
      {{ .Summary }}
    </div>
    {{ end -}}
  </div>  
</a>
