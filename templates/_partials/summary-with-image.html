<article class="h-entry preview-recent-posts">
  <div class="preview-image-div">
    <a class="featured-image-preview-im-link" href="{{.RelPermalink}}">
      <img src="{{- .Params.featured_image -}}" alt="{{ $.Params.f_alt | default $.Title }}" class="featured-image-preview-section">
    </a>
  </div>

  <div class="preview-summary-div">
    <h2 class="p-name"><a class="u-url preview-summary-link-header" href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></h2>
    
    <p class="meta">
      {{- $dateMachine := .Date | time.Format "2006-01-02T15:04:05-07:00" -}}
      {{- $dateHuman := .Date | time.Format ":date_long" -}}
      <time class="dt-published" datetime="{{ $dateMachine }}">{{ $dateHuman }}</time>
      <span class="reading-time-words">- {{ .ReadingTime }}-minute read - {{ .WordCount }} words - by</span>
      <span class="p-author h-card">
	<a class="u-url p-name" href="{{ .Site.BaseURL }}"> {{ .Site.Title }}</a>
      </span>
    </p>
    
    <a class="preview-summary-link-text" href="{{ .RelPermalink }}">
      <div class="p-summary">{{ .Summary }}</div>
    </a>  
  </div>
</article>
